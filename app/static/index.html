<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>播客选题库</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>

<dialog id="confirmDlg">
  <p id="confirmMsg"></p>
  <div class="dlg-actions">
    <button class="btn ghost" id="confirmNo">取消</button>
    <button class="btn danger" id="confirmYes">确定</button>
  </div>
</dialog>

<dialog id="promptDlg">
  <p id="promptMsg"></p>
  <textarea id="promptInput" maxlength="200" rows="2" placeholder="输入标题…" style="resize:none"></textarea>
  <div class="dlg-actions">
    <button class="btn ghost" id="promptNo">取消</button>
    <button class="btn primary" id="promptYes">创建</button>
  </div>
</dialog>

<dialog id="settingsDlg">
  <h2>⚙ 设置</h2>

  <section>
    <h3>列表排序</h3>
    <div class="sort-row">
      <label>按
        <select id="sortField">
          <option value="updated_at">最近更新</option>
          <option value="created_at">创建时间</option>
          <option value="title">标题</option>
        </select>
      </label>
      <label>
        <select id="sortOrder">
          <option value="desc">降序</option>
          <option value="asc">升序</option>
        </select>
      </label>
    </div>
    <p class="hint">修改后立即生效并保存</p>
  </section>

  <section>
    <h3>修改访问密码</h3>
    <div class="form-col">
      <input type="password" id="oldPw" placeholder="当前密码" autocomplete="current-password">
      <input type="password" id="newPw" placeholder="新密码（至少 6 位）" autocomplete="new-password">
      <input type="password" id="newPw2" placeholder="再输入一次新密码" autocomplete="new-password">
      <button class="btn primary" id="pwBtn">修改密码</button>
    </div>
  </section>

  <section>
    <h3>数据备份</h3>
    <div class="form-col">
      <a class="btn ghost" id="exportBtn" href="/api/export" download>⬇ 导出全部数据（JSON）</a>
      <label class="file-label">选择要导入的 JSON 文件
        <input type="file" id="importFile" accept=".json,application/json">
      </label>
      <div class="import-mode">
        <label><input type="radio" name="importMode" value="append" checked> 追加导入（保留现有记录）</label>
        <label><input type="radio" name="importMode" value="replace"> 替换导入（清空后导入，谨慎）</label>
      </div>
      <button class="btn primary" id="importBtn" disabled>导入</button>
    </div>
  </section>

  <div class="dlg-actions">
    <button class="btn ghost" id="settingsClose">关闭</button>
    <button class="btn ghost" id="logoutBtn">退出登录</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
